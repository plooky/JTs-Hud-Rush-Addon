name: Release HUD assets

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out JT Hud RUSH Manager
        uses: actions/checkout@v4
        with:
          repository: plooky/JTs-Hud-Rush-Manager
          ref: cc0de7055501a317a7a423e0b663a1636a25e19d
          path: _manager
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: _manager/package-lock.json
      - name: Verify release version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = (Get-Content .\hud.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match hud.json version $version."
          }
      - name: Build and test release assets
        shell: pwsh
        run: .\Build-RushHud.ps1
      - name: Build complete Windows installer
        shell: pwsh
        run: |
          $version = (Get-Content .\hud.json -Raw | ConvertFrom-Json).version
          Remove-Item .\_manager\resources\rush-hud -Recurse -Force
          Expand-Archive .\dist\rush-hud.zip .\_manager\resources\rush-hud
          npm ci --prefix .\_manager
          npm --prefix .\_manager run build:win -- --publish never
          $managerInstaller = Get-ChildItem .\_manager\dist\*-setup.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $managerInstaller) { throw 'Electron Builder did not produce a Windows setup executable.' }
          $installer = Join-Path $PWD "dist\RUSH-Live-for-JT-Hud-v$version-Setup.exe"
          Copy-Item $managerInstaller.FullName $installer
          $archiveHash = (Get-FileHash .\dist\rush-hud.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $installerHash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content .\dist\SHA256SUMS.txt -Encoding ascii -Value @(
            "$archiveHash  rush-hud.zip"
            "$installerHash  $(Split-Path -Leaf $installer)"
          )
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rush-hud-release-assets
          path: |
            dist/rush-hud.zip
            dist/RUSH-Live-for-JT-Hud-v*-Setup.exe
            dist/SHA256SUMS.txt
      - name: Create or update GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $releaseTag = $env:GITHUB_REF_NAME
            $releaseTitle = "RUSH Live for JT Hud $releaseTag"
          } else {
            $releaseTag = 'continuous'
            $releaseTitle = 'Latest development build'
            git tag -f $releaseTag $env:GITHUB_SHA
            git push origin "refs/tags/$releaseTag" --force
          }

          gh release view $releaseTag 2>$null
          if ($LASTEXITCODE -ne 0) {
            if ($releaseTag -eq 'continuous') {
              gh release create $releaseTag --title $releaseTitle --prerelease --target $env:GITHUB_SHA --notes "Automated installer build from commit $env:GITHUB_SHA."
            } else {
              gh release create $releaseTag --title $releaseTitle --generate-notes
            }
          } elseif ($releaseTag -eq 'continuous') {
            gh release edit $releaseTag --title $releaseTitle --prerelease --notes "Automated installer build from commit $env:GITHUB_SHA."
          }
          $installer = (Get-ChildItem .\dist\RUSH-Live-for-JT-Hud-v*-Setup.exe).FullName
          gh release upload $releaseTag .\dist\rush-hud.zip $installer .\dist\SHA256SUMS.txt --clobber
